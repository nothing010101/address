<style>
:root { --bg:#0d0f1a; --card:#161a2b; --line:#232842; --txt:#eef0fa; --sub:#8b92b3; --acc:#4f46ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, sans-serif; }
header { position:sticky; top:0; background:var(--bg); padding:12px; border-bottom:1px solid var(--line); z-index:2; }
#q { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:16px; outline:none; }
#q:focus { border-color:var(--acc); }
.bar { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:13px; color:var(--sub); }
.bar button { background:none; border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:5px 10px; font-size:12px; }
.row { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
.row.on { background:#1a1f3a; }
.row input { width:22px; height:22px; accent-color:var(--acc); flex:none; }
.info { flex:1; min-width:0; }
.nm { font-weight:600; font-size:15px; }
.ad { font-size:12px; color:var(--sub); word-break:break-all; margin-top:2px; font-family: ui-monospace, monospace; }
.cp { background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 12px; font-size:13px; flex:none; }
.cp.ok { background:var(--acc); border-color:var(--acc); }
.all { width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1px solid var(--acc); background:none; color:var(--txt); font-size:14px; }
.all.ok { background:var(--acc); }
#kosong { padding:30px; text-align:center; color:var(--sub); display:none; }
mark { background:#4f46ff55; color:inherit; border-radius:3px; }
</style>
</head>

  const ok = () => { btn.textContent = "Tersalin"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = t0; btn.classList.remove("ok"); }, 1200); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(ok, () => lama(txt, ok));
  } else lama(txt, ok);
}

function lama(txt, ok) {
  const t = document.createElement("textarea");
  t.value = txt; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  t.remove();
}

function render() {
  const k = q.value.trim().toLowerCase();
  const hasil = data.map((d, i) => ({ ...d, i })).filter(d => !k || d.n.toLowerCase().includes(k) || d.a.toLowerCase().includes(k));
  list.innerHTML = hasil.map(d => `<div class="row${done[d.i] ? " on" : ""}" data-i="${d.i}">
    <input type="checkbox"${done[d.i] ? " checked" : ""}>
    <div class="info"><div class="nm">${hl(d.n, k)}</div><div class="ad">${hl(d.a, k)}</div></div>
    <button class="cp">Salin</button></div>`).join("");
  kosong.style.display = hasil.length ? "none" : "block";
  tampil = hasil;
  all.textContent = hasil.length === data.length ? "Salin semua alamat (" + hasil.length + ")" : "Salin " + hasil.length + " alamat yang tampil";
  const c = Object.keys(done).length;
  info.textContent = `${hasil.length} dari ${data.length} alamat · ${c} dicentang`;
}

list.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  const i = +row.dataset.i;
  if (e.target.classList.contains("cp")) return salin(data[i].a, e.target);
  if (e.target.type !== "checkbox") return;
  if (e.target.checked) done[i] = 1; else delete done[i];
  row.classList.toggle("on", e.target.checked);
  save();
  info.textContent = info.textContent.replace(/\d+ dicentang/, Object.keys(done).length + " dicentang");
});

document.getElementById("reset").onclick = () => {
  if (!confirm("Hapus semua centang?")) return;
  done = {}; save(); render();
};

all.onclick = () => salin(tampil.map(d => d.a).join("\n"), all);

q.addEventListener("input", render);
render();
</script>
</body>
</html>
